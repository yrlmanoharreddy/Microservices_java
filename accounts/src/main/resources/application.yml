server:
  port: 8080

spring:
  application:
    name: 'account'

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/intdb}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
